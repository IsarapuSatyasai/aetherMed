version: "3.9"

services:
  db:
    image: postgres:15
    container_name: aethermed-db
    environment:
      POSTGRES_USER: aethermed
      POSTGRES_PASSWORD: aethermed123
      POSTGRES_DB: aethermed
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: .
    container_name: aethermed-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://aethermed:aethermed123@db:5432/aethermed
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: .
    container_name: aethermed-frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://backend:8000
    volumes:
      - ./frontend:/app/frontend
      - ./data:/app/data
    command: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: